name: Bug report
description: Something in Strata is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Strata version
      placeholder: 1.0.0-beta.1 (shown in Help > About, or commit if built from source)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS 15
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select a wedge part and click Create
        2. ...
  - type: textarea
    id: extra
    attributes:
      label: Output log, screenshots, or a small .rbxl
      description: Drag files here. Errors from the Output window are most useful.
